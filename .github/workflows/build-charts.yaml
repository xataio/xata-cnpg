name: "🔗 Build and Push Helm Charts"

on:
  workflow_call:
    inputs:
      image_specs:
        description: "Newline-separated IMAGE=xxx TAG=yyy pairs"
        required: true
        type: string
      ref:
        description: "Git ref to checkout"
        required: false
        type: string
        default: ""

jobs:
  push-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install regctl
        uses: regclient/actions/regctl-installer@main

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          regctl registry login ghcr.io -u ${{ github.actor }} -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Inject image tags into charts
        working-directory: charts
        run: |
          echo '${{ inputs.image_specs }}' | while IFS= read -r line; do
            if [[ -n "$line" ]]; then
              # Parse IMAGE and TAG from the line
              eval "$line"
              # Resolve 'latest' to actual tag by finding matching digest
              if [[ "$TAG" == "latest" ]]; then
                TAG=$(make -C .. find-tag IMAGE="$IMAGE")
                echo "Resolved $IMAGE:latest -> $IMAGE:$TAG"
              fi
              make inject-tags IMAGE="$IMAGE" TAG="$TAG"
            fi
          done

      - name: Package and push charts
        working-directory: charts
        run: make push-charts
